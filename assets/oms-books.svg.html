<!doctype html>
<html><head><meta charset="utf-8"><title>Books</title>
<style>body{margin:0;background:#fff} svg{font-family:system-ui,Segoe UI,Arial;font-size:15px}
.box{stroke:#555;stroke-width:1.5;fill:#f4f4f4}
.want{fill:#e6f5e6;stroke:#2e7d32;stroke-width:2}
.derived{fill:#e8f0ff;stroke:#3a6ea5;stroke-width:2}
.truth{fill:#ffe9a8;stroke:#b8860b;stroke-width:3}
.human{fill:#fde2e2;stroke:#c62828;stroke-width:2}
.group{fill:none;stroke:#999;stroke-width:1.5;stroke-dasharray:6 4}
.t{text-anchor:middle}
.b{font-weight:600}
.s{font-size:13px;fill:#444}
.lab{font-size:13px;fill:#333;text-anchor:middle}
.arrow{stroke:#333;stroke-width:1.8;fill:none;marker-end:url(#ah)}
.dot{stroke:#3a6ea5;stroke-width:1.6;fill:none;stroke-dasharray:5 4;marker-end:url(#ahb)}
</style></head><body>
<svg width="1500" height="960" viewBox="0 0 1500 960" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="ahb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ea5"/></marker>
</defs>

<!-- STRATEGIES -->
<rect x="60" y="20" width="480" height="110" class="group"/>
<text x="70" y="40" class="s b">STRATEGY PROCESSES — logic only, one process each</text>
<rect x="100" y="55" width="200" height="60" rx="6" class="box"/>
<text x="200" y="90" class="t b">strategy ic-btc-1</text>
<rect x="330" y="55" width="200" height="60" rx="6" class="box"/>
<text x="430" y="90" class="t b">strategy xyz-2</text>

<!-- OMS -->
<rect x="60" y="180" width="1400" height="440" class="group"/>
<text x="70" y="200" class="s b">ORDER MANAGEMENT SYSTEM</text>

<!-- DESIRED -->
<rect x="90" y="220" width="440" height="280" class="group"/>
<text x="100" y="240" class="s b">DESIRED — what the engine WANTS</text>
<rect x="120" y="255" width="170" height="70" rx="6" class="want"/>
<text x="205" y="282" class="t b">Book 1 · desired:ic-btc-1</text>
<text x="205" y="303" class="t s">signed lots per contract</text>
<rect x="330" y="255" width="170" height="70" rx="6" class="want"/>
<text x="415" y="282" class="t b">Book 1 · desired:xyz-2</text>
<text x="415" y="303" class="t s">signed lots per contract</text>
<rect x="200" y="400" width="220" height="80" rx="6" class="want"/>
<text x="310" y="432" class="t b">Book 2 · desired:pooled</text>
<text x="310" y="455" class="t s">= Σ Book 1, per contract</text>

<!-- ORDERS / WORKING -->
<rect x="560" y="300" width="240" height="90" rx="6" class="box"/>
<text x="680" y="328" class="t b">ORDERS TO EXECUTE</text>
<text x="680" y="350" class="t s">= desired − actual − working</text>
<text x="680" y="370" class="t s">per contract</text>
<rect x="560" y="530" width="240" height="60" rx="6" class="box"/>
<text x="680" y="555" class="t b">WORKING ORDERS</text>
<text x="680" y="575" class="t s">sent, not yet filled</text>

<!-- ACTUAL -->
<rect x="870" y="220" width="560" height="370" class="group"/>
<text x="880" y="240" class="s b">ACTUAL — what is really HELD</text>
<rect x="1150" y="250" width="120" height="70" rx="6" class="derived"/>
<text x="1210" y="278" class="t b">Book 3</text>
<text x="1210" y="300" class="t s">actual:ic-btc-1</text>
<rect x="1290" y="250" width="120" height="70" rx="6" class="derived"/>
<text x="1350" y="278" class="t b">Book 3</text>
<text x="1350" y="300" class="t s">actual:xyz-2</text>
<rect x="1170" y="370" width="220" height="80" rx="6" class="derived"/>
<text x="1280" y="398" class="t b">Book 4 · actual:engine</text>
<text x="1280" y="418" class="t s">only fills that carry</text>
<text x="1280" y="436" class="t s">the engine's mark</text>
<rect x="890" y="470" width="220" height="80" rx="6" class="truth"/>
<text x="1000" y="496" class="t b">Book 5 · actual:broker</text>
<text x="1000" y="516" class="t s">net per contract, as reported</text>
<text x="1000" y="536" class="t b">THE TRUTH</text>
<rect x="1170" y="470" width="220" height="80" rx="6" class="derived"/>
<text x="1280" y="496" class="t b">Book 6 · discretionary</text>
<text x="1280" y="516" class="t s">= Book 5 − Book 4</text>
<text x="1280" y="536" class="t s">derived, never entered</text>

<!-- BOTTOM ROW -->
<rect x="300" y="680" width="240" height="80" rx="6" class="box"/>
<text x="420" y="710" class="t b">RMS</text>
<text x="420" y="730" class="t s">strategy-wise + engine-wise checks</text>
<text x="420" y="748" class="t s">hard reject only</text>
<rect x="600" y="680" width="240" height="80" rx="6" class="box"/>
<text x="720" y="710" class="t b">EXECUTION</text>
<text x="720" y="730" class="t s">limit at touch,</text>
<text x="720" y="748" class="t s">cancel and replace</text>
<rect x="900" y="650" width="320" height="130" class="group"/>
<text x="910" y="670" class="s b">BROKER ADAPTER — Delta, paper, IBKR</text>
<rect x="920" y="695" width="100" height="60" rx="6" class="box"/>
<text x="970" y="730" class="t b">broker</text>
<rect x="1045" y="685" width="160" height="80" rx="6" class="box"/>
<text x="1125" y="708" class="t b">fill tagger</text>
<text x="1125" y="727" class="t s">ENGINE: has our</text>
<text x="1125" y="743" class="t s">client_order_id</text>
<text x="1125" y="759" class="t s">MANUAL: does not</text>
<rect x="600" y="830" width="240" height="60" rx="6" class="human"/>
<text x="720" y="855" class="t b">HUMAN trades by hand</text>
<text x="720" y="875" class="t s">on the broker's app</text>

<!-- ARROWS: strategies publish targets -->
<path d="M170,115 L170,255" class="arrow"/>
<text x="285" y="160" class="lab">each publishes its whole target, every change</text>
<path d="M400,115 L400,255" class="arrow"/>
<!-- Book1 -> Book2 -->
<path d="M205,325 L270,400" class="arrow"/>
<path d="M415,325 L350,400" class="arrow"/>
<!-- Book2 -> Orders -->
<path d="M420,430 L560,360" class="arrow"/>
<text x="480" y="385" class="lab">desired</text>
<!-- Book4 -> Orders -->
<path d="M1170,400 L800,345" class="arrow"/>
<text x="985" y="355" class="lab">actual (engine's share)</text>
<!-- Working -> Orders -->
<path d="M680,530 L680,390" class="arrow"/>
<text x="705" y="465" class="lab">working</text>
<!-- Orders -> RMS -->
<path d="M600,390 L440,680" class="arrow"/>
<!-- RMS -> Execution -> broker -->
<path d="M540,720 L600,720" class="arrow"/>
<path d="M840,720 L920,722" class="arrow"/>
<!-- Execution records working -->
<path d="M720,680 L720,590" class="dot"/>
<text x="750" y="640" class="lab">records</text>
<!-- broker -> tagger -->
<path d="M1020,725 L1045,725" class="arrow"/>
<!-- human -> broker -->
<path d="M840,860 L970,860 L970,755" class="arrow"/>
<!-- broker -> Book5 positions -->
<path d="M960,695 L960,620 L1000,620 L1000,550" class="arrow"/>
<text x="915" y="615" class="lab">positions</text>
<!-- tagger -> Book4 -->
<path d="M1205,745 L1440,745 L1440,410 L1390,410" class="arrow"/>
<text x="1330" y="770" class="lab">engine fills, each with a strategy id</text>
<!-- Book5, Book4 -> Book6 -->
<path d="M1110,510 L1170,510" class="arrow"/>
<path d="M1280,450 L1280,470" class="arrow"/>
<!-- Book4 -> Book3 -->
<path d="M1240,370 L1210,320" class="arrow"/>
<path d="M1320,370 L1350,320" class="arrow"/>
<!-- Book3 -> strategies (own fills) -->
<path d="M1210,250 L1210,160 L260,160 L260,115" class="dot"/>
<path d="M1350,250 L1350,145 L480,145 L480,115" class="dot"/>
<text x="700" y="140" class="lab" style="fill:#3a6ea5">each strategy reads only its own Book 3</text>

<!-- LEGEND / IDENTITY -->
<text x="70" y="925" class="s b">Identity the OMS checks, contract by contract:  Book 4 + Book 6 = Book 5,  and  Σ Book 3 = Book 4.   A mismatch freezes that contract and alerts.</text>
<rect x="70" y="938" width="14" height="14" class="want"/><text x="90" y="950" class="s">what strategies want</text>
<rect x="260" y="938" width="14" height="14" class="derived"/><text x="280" y="950" class="s">derived by the engine from tagged fills</text>
<rect x="560" y="938" width="14" height="14" class="truth"/><text x="580" y="950" class="s">the broker's word, never overridden</text>
<rect x="840" y="938" width="14" height="14" class="human"/><text x="860" y="950" class="s">outside the engine</text>
</svg>
</body></html>
